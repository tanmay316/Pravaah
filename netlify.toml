# Netlify: connect the repo (it builds with the settings below), or deploy a local build with
#   .\scripts\deploy_web.ps1 -Target netlify
# Set the EXPO_PUBLIC_* variables from apps/expo/.env in Site settings > Environment variables;
# .env is git-ignored, so git-based builds don't see it.

[build]
  base = "apps/expo"
  command = "npx expo export --platform web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "microphone=(self), camera=()"

[[headers]]
  for = "/_expo/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

# Client-side routes (/session, /auth, ...). Existing files are served first.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
