# LiteLLM Proxy Configuration — Pravaah Voice Agent
# Run with: litellm --config config.yaml --port 4000
#
# Model routing is configuration-only.
# No model IDs are hardcoded in business logic.

model_list:
  # Primary: Groq OSS
  - model_name: "tutor-model"
    litellm_params:
      model: "groq/openai/gpt-oss-20b"
      api_key: "os.environ/GROQ_API_KEY"

router_settings:
  routing_strategy: "usage-based-routing"
  num_retries: 0
  timeout: 10

general_settings:
  master_key: "sk-pravaah-dev-key"
