# Pravaah web app (Expo export in apps/expo/dist) behind nginx.
# Used by deploy/web/Dockerfile; also works on a VPS: copy dist to /usr/share/nginx/html
# and this file to /etc/nginx/conf.d/default.conf, then put TLS in front (certbot / a load balancer).
# The microphone only works over HTTPS (or localhost).

# Content-hashed bundles/assets are immutable; everything else (index.html for every
# client-side route, sw.js, manifest) must revalidate so browsers never keep a page that
# points at a bundle a later deploy removed.
map $uri $pravaah_cache_control {
    ~^/(_expo|assets)/  "public, max-age=31536000, immutable";
    default             "no-cache";
}

map $uri $pravaah_cors {
    ~^/(_expo|assets)/  "*";
    default             "";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header Cache-Control $pravaah_cache_control always;
    add_header Access-Control-Allow-Origin $pravaah_cors always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "microphone=(self), camera=()" always;

    # A missing bundle must 404, not fall back to index.html (that renders a blank page).
    location ~ ^/(_expo|assets)/ {
        try_files $uri =404;
    }

    # Client-side routes (/session, /auth, ...) all load index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
