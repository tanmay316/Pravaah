model_list:
  - model_name: gemini-3.5-flash-lite
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: "os.environ/GEMINI_API_KEY"

  - model_name: minimax-m3
    litellm_params:
      model: openrouter/minimax/minimax-m3:free
      api_key: "os.environ/OPENROUTER_API_KEY"

  - model_name: nemotron-3.5-lightning
    litellm_params:
      model: openai/nvidia/nemotron-3.5-lightning-30b-a3b
      api_base: https://integrate.api.nvidia.com/v1
      api_key: "os.environ/NVIDIA_API_KEY"

  - model_name: gemini-2.5-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: "os.environ/GEMINI_API_KEY"

router_settings:
  fallbacks:
    - gemini-2.5-flash: ["minimax-m3", "nemotron-3.5-lightning"]
    - gemini-3.5-flash-lite: ["minimax-m3", "nemotron-3.5-lightning", "gemini-2.5-flash"]
  retry_after: 5
  num_retries: 3
