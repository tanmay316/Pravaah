services:
  # REST API + embedded neural TTS ONLY. RUN_VOICE_AGENT stays false: co-hosting the realtime
  # agent here was tried and confirmed in production logs to OOM-kill the whole container mid
  # -call (Render's "exceeded memory limit" alert), which also took the REST API down with it
  # until Render finished restarting - the cause of "Could not reach the coaching service" on
  # the dashboard right after a call. Deploy the agent separately: LiveKit Cloud Agents
  # (livekit.toml) or an Oracle Cloud Always-Free VM (scripts/oracle_setup.sh). See
  # docs/DEPLOYMENT.md.
  - type: web
    name: pravaah-backend
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: RUN_VOICE_AGENT
        value: "false"
      - key: ALLOW_DEMO_AUTH
        value: "false"
