services:
  # REST API + embedded neural TTS, co-hosting the realtime voice agent.
  #
  # Co-hosting is the simplest free single-service setup, but 0.1 vCPU is genuinely tight for
  # a realtime agent. If the logs show "job executor is unresponsive" or audio breaks up,
  # move the agent to LiveKit Cloud Agents (livekit.toml) and set RUN_VOICE_AGENT=false.
  - type: web
    name: pravaah-backend
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: RUN_VOICE_AGENT
        value: "true"
      # A second interpreter per job does not fit in 512MB, so run jobs as threads here.
      - key: JOB_EXECUTOR
        value: thread
      - key: ALLOW_DEMO_AUTH
        value: "false"
