name: Keep Render backend awake

# Render's free plan sleeps after 15 idle minutes; a ping every 10 keeps it warm.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: |
          curl --fail --silent --show-error --max-time 90 \
            --retry 3 --retry-delay 10 --retry-all-errors \
            https://pravaah-backend-ntlz.onrender.com/health
