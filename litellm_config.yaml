model_list:
  - model_name: qwen-3.8-27b-groq
    litellm_params:
      model: groq/qwen/qwen3.8-27b
      api_key: "os.environ/GROQ_API_KEY"
      reasoning_effort: "none"

  - model_name: gpt-oss-20b-groq
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: "os.environ/GROQ_API_KEY"
      reasoning_effort: "low"

  - model_name: llama-3.2-11b-nim
    litellm_params:
      model: openai/meta/llama-3.2-11b-vision-instruct
      api_base: https://integrate.api.nvidia.com/v1
      api_key: "os.environ/NVIDIA_API_KEY"

  - model_name: gemini-3.5-flash-lite
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: "os.environ/GEMINI_API_KEY"

  - model_name: minimax-01
    litellm_params:
      model: openrouter/minimax/minimax-01
      api_key: "os.environ/OPENROUTER_API_KEY"

  - model_name: nemotron-3.5-lightning
    litellm_params:
      model: openai/nvidia/nemotron-3.5-lightning-30b-a3b
      api_base: https://integrate.api.nvidia.com/v1
      api_key: "os.environ/NVIDIA_API_KEY"

  - model_name: gemini-2.5-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: "os.environ/GEMINI_API_KEY"

router_settings:
  fallbacks:
    - qwen-3.8-27b-groq: ["gpt-oss-20b-groq", "llama-3.2-11b-nim", "gemini-3.5-flash-lite"]
    - gemini-3.5-flash-lite: ["qwen-3.8-27b-groq", "gpt-oss-20b-groq", "llama-3.2-11b-nim", "minimax-01", "gemini-2.5-flash"]
    - gemini-2.5-flash: ["qwen-3.8-27b-groq", "minimax-01", "llama-3.2-11b-nim"]
  retry_after: 5
  num_retries: 3
