steps:
  # 1. Build the Docker container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/pravaah-backend:$COMMIT_SHA'
      - '-f'
      - 'Dockerfile'
      - '.'

  # 2. Push image to Google Container/Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/pravaah-backend:$COMMIT_SHA'

  # 3. Deploy image to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'pravaah-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/pravaah-backend:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'

images:
  - 'gcr.io/$PROJECT_ID/pravaah-backend:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
